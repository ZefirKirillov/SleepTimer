name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SleepAlarm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          build-root-directory: SleepAlarm
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SleepAlarm-apk
          path: SleepAlarm/app/build/outputs/apk/debug/app-debug.apk
